          - paragraph [ref=e398]: "LM317 3-Pin Adjustable Regulator 1 Features • Output voltage range: – Adjustable: 1.25V to 37V • Output current: 1.5A • Line regulation: 0.01%/V (typ) • Load regulation: 0.1% (typ) • Internal short-circuit current limiting • Thermal overload protection • Output safe-area compensation (new chip) • PSRR: 80dB at 120Hz for $\\mathsf { C } _ { \\mathsf { A D J } } = 1 0 \\mu \\mathsf { F }$ (new chip) • Packages: – 4-pin, SOT-223 (DCY) – 3-pin, TO-263 (KTT) – 3-pin, TO-220 (KCS, KCT), legacy chip 2 Applications • Multifunction printers • AC drive power stage modules • Electricity meters • Servo drive control modules • Merchant network and server PSU \\*Needed if the device is more than 6 inches from filter capacitors. †Optional, improves transient response. ††See Equation 1. $$ V _ { O U T } = \\mathrm { 1 . 2 5 } V \\times \\left( 1 \\ : + \\ : \\frac { R _ { 2 } } { R _ { 1 } } \\right) \\ : + \\ : I _ { A D J } \\times \\ : ( R _ { 2 } )\\tag{1} $$ Typical Application 3 Description The LM317 is an adjustable three-pin, positive-voltage regulator capable of supplying more than 1.5A over an output voltage range of 1.25V to 37V. The device requires only two external resistors to set the output voltage. The device features a typical line regulation of 0.01% and typical load regulation of 0.1%. The LM317 includes current limiting, thermal overload protection, and safe operating area protection. Overload protection remains functional even if the ADJUST pin is disconnected. Typically, no capacitors are needed unless the device is situated more than 6 inches from the input filter capacitors. In that case, an input bypass is needed. Add an optional output capacitor to improve transient response. Bypass the adjustment pin to achieve very high ripple rejection ratios that are difficult to achieve with standard 3-pin regulators. (3) Legacy chip."
