          - paragraph [ref=e443]: "8.4 Power Supply Recommendations The LM317 is designed to operate from an input voltage supply range between 1.25V to 37V greater than the output voltage. If the device is more than six inches from the input filter capacitors, use an input bypass capacitor of any type for stability. Make sure this capacitor is 0.1μF or greater. 8.5 Layout 8.5.1 Layout Guidelines • Bypass the input pin to ground with a bypass capacitor. • The optimum placement is closest to the input pin of the device and the system GND. Take care to minimize the loop area formed by the bypass-capacitor connection, the input pin, and the system GND. • For operation at full rated load, use wide trace lengths to eliminate ${ \\sf I } \\times { \\sf R }$ drop and heat dissipation. 8.5.1.1 Thermal Considerations 8.5.1.1.1 Heat Sink Requirements The LM317 (new chip) regulators have internal thermal shutdown to protect the device from overheating. Under all operating conditions, make sure the device junction temperature does not exceed the rated maximum junction temperature $( \\mathsf { T } _ { \\mathsf { J } } )$ of $1 2 5 ^ { \\circ } \\mathrm { C }$ for the LM317 (new chip). A heat sink is required depending on the maximum device power dissipation and the maximum ambient temperature of the application. To determine if a heat sink is needed, Equation 9 calculates the power dissipated by the regulator, $\\mathsf { P } _ { \\mathsf { D } }$ $$ \\mathsf { P } _ { \\mathsf { D } } = ( ( \\mathsf { V } _ { \\mathsf { I N } } - \\mathsf { V } _ { \\mathsf { O U T } } ) \\times \\mathsf { I } _ { \\mathsf { L } } ) + ( \\mathsf { V } _ { \\mathsf { I N } } \\times \\mathsf { I } _ { \\mathsf { G } } )\\tag{9} $$ Figure 8-18 shows the voltage and currents that are present in the circuit. Equation 10 calculates the next parameter, which is the maximum allowable temperature rise, TR(MAX). $$ \\mathsf { T } _ { \\mathsf { R } ( \\mathrm { M"
