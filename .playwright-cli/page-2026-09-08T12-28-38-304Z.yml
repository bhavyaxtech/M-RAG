          - paragraph [ref=e413]: "7 Detailed Description 7.1 Overview The LM317 is an adjustable three-pin, positive-voltage regulator capable of supplying up to 1.5A over an output voltage range of 1.25V to 37V. The device requires only two external resistors to set the output voltage. The device features a typical line regulation of 0.01% and typical load regulation of 0.1%. The LM317 includes current limiting, thermal overload protection, and safe operating area protection. Overload protection remains functional even if the ADJUST pin is disconnected. The LM317 is designed to minimize the $\\mathsf { I } _ { \\mathsf { A D J U S T } }$ current and make this current constant with line and load changes. A 100μA current from the ADJUST pin represents an error term. 7.2 Functional Block Diagram 7.3 Feature Description 7.3.1 NPN Darlington Output Drive The NPN Darlington output topology provides naturally low output impedance and an output capacitor is optional. A 3V headroom is recommended $( \\mathsf { V } _ { \\mathsf { I } } - \\mathsf { V } _ { \\mathsf { O } } )$ to support maximum current and lowest temperature. 7.3.2 Overload Block Overcurrent and overtemperature shutdown protects the device against overload or damage from operating in excessive heat. 7.3.3 Programmable Feedback An op amp with a 1.25V offset input at the ADJUST pin provides easy output voltage or current programming (but not both). For current regulation applications, use a single resistor whose resistance value is $1 . 2 5 \\mathsf { V } / \\mathsf { I } _ { 0 }$ and a power rating greater than $( 1 . 2 5 \\mathsf { V } ) ^ { 2 } / \\mathsf { R } .$ . For voltage regulation applications, two resistors set the output voltage."
